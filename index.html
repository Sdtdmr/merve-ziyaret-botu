<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Ziyaret Asistanı</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error-container": "#ffdad6", "inverse-surface": "#2d3133", "on-secondary-container": "#00714d",
                        "surface-bright": "#f7f9fb", "on-background": "#191c1e", "on-surface-variant": "#434655",
                        "outline": "#737686", "on-surface": "#191c1e", "on-error-container": "#93000a",
                        "secondary-container": "#6cf8bb", "primary": "#004ac6", "error": "#ba1a1a",
                        "surface-container-low": "#f2f4f6", "surface-dim": "#d8dadc", "on-secondary": "#ffffff",
                        "surface": "#f7f9fb", "surface-container-lowest": "#ffffff", "outline-variant": "#c3c6d7",
                        "surface-container-high": "#e6e8ea", "surface-variant": "#e0e3e5", "on-primary": "#ffffff",
                        "secondary": "#006c49"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"], "headline-sm": ["Inter"], "label-md": ["Inter"]
                    }
                }
            }
        }
    </script>
    <style>
        .neomorphic-card { box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.05), -4px -4px 8px rgba(255, 255, 255, 0.8); }
        .neomorphic-button { box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1), -2px -2px 5px rgba(255, 255, 255, 0.5); }
        /* Scrollbar styling for the dropdown */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #c3c6d7; border-radius: 10px; }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen pb-20">

    <!-- Top Navigation Bar -->
    <header class="fixed top-0 w-full z-40 bg-surface/80 backdrop-blur-xl border-b border-white/20 shadow-sm flex justify-between items-center px-5 py-3">
        <div class="flex items-center gap-3">
            <div>
                <h1 class="font-headline-sm text-xl text-primary font-bold">Ziyaret Asistanı</h1>
                <p class="font-label-md text-xs text-on-surface-variant font-medium tracking-wide">Sedat Demir</p>
            </div>
        </div>
        <button id="openSettingsBtn" class="text-on-surface-variant hover:bg-surface-container-highest/50 transition-colors p-2 rounded-full active:scale-95 duration-200">
            <span class="material-symbols-outlined" data-icon="settings">settings</span>
        </button>
    </header>

    <!-- Toast Notification -->
    <div class="fixed top-20 left-1/2 transform -translate-x-1/2 z-50 transition-all duration-400 opacity-0 -translate-y-full flex items-center gap-2 bg-secondary-container text-on-secondary-container px-6 py-3 rounded-full shadow-lg font-label-md text-sm font-medium whitespace-nowrap" id="toast">
        <span class="material-symbols-outlined" id="toastIcon">check_circle</span>
        <span id="toastText">Log Kaydedildi</span>
    </div>

    <!-- Main Content -->
    <main class="pt-[90px] px-5 max-w-2xl mx-auto">
        <div class="bg-surface-container-lowest rounded-2xl p-6 neomorphic-card">
            <form class="flex flex-col gap-5" id="visitForm">
                
                <!-- Row 1: Date & Visit No -->
                <div class="flex flex-col md:flex-row gap-4">
                    <div class="flex-1 flex flex-col gap-1">
                        <label class="font-label-md text-xs font-semibold text-on-surface-variant ml-1">Tarih</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
                                <span class="material-symbols-outlined text-[20px]">calendar_month</span>
                            </div>
                            <input id="tarih" class="w-full bg-surface-container-low border border-outline-variant rounded-xl py-3 pl-[40px] pr-3 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors text-on-surface font-body-md" type="date"/>
                        </div>
                    </div>
                    <div class="flex-1 flex flex-col gap-1">
                        <label class="font-label-md text-xs font-semibold text-on-surface-variant ml-1">Ziyaret No</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
                                <span class="material-symbols-outlined text-[20px]">tag</span>
                            </div>
                            <input id="ziyaretNo" class="w-full bg-surface-container-low border border-outline-variant rounded-xl py-3 pl-[40px] pr-3 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors text-on-surface font-body-md" placeholder="1, 2, 3..." type="number"/>
                        </div>
                    </div>
                </div>

                <!-- Row 2: City & District -->
                <div class="flex flex-col md:flex-row gap-4">
                    <div class="flex-1 flex flex-col gap-1 relative">
                        <label class="font-label-md text-xs font-semibold text-on-surface-variant ml-1">Şehir</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
                                <span class="material-symbols-outlined text-[20px]">search</span>
                            </div>
                            <!-- Arama yapılabilen input -->
                            <input id="sehir" type="text" autocomplete="off" class="w-full bg-surface-container-low border border-outline-variant rounded-xl py-3 pl-[40px] pr-3 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors text-on-surface font-body-md" placeholder="Şehir ara..."/>
                        </div>
                        <!-- Açılır Arama Listesi -->
                        <ul id="sehirList" class="absolute top-full left-0 right-0 mt-1 bg-surface-container-lowest border border-outline-variant rounded-xl shadow-lg max-h-48 overflow-y-auto custom-scrollbar z-50 hidden flex-col">
                            <!-- JS ile şehirler buraya eklenecek -->
                        </ul>
                    </div>
                    
                    <div class="flex-1 flex flex-col gap-1">
                        <label class="font-label-md text-xs font-semibold text-on-surface-variant ml-1">İlçe</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
                                <span class="material-symbols-outlined text-[20px]">map</span>
                            </div>
                            <!-- Otomatik dolan metin kutusu -->
                            <input id="ilce" class="w-full bg-surface-container-low border border-outline-variant rounded-xl py-3 pl-[40px] pr-3 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors text-on-surface font-body-md" type="text" placeholder="Otomatik dolar"/>
                        </div>
                    </div>
                </div>

                <!-- Row 3: Hospital -->
                <div class="flex flex-col gap-1">
                    <label class="font-label-md text-xs font-semibold text-on-surface-variant ml-1">Hastane / Kurum Adı</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
                            <span class="material-symbols-outlined text-[20px]">local_hospital</span>
                        </div>
                        <input id="hastane" class="w-full bg-surface-container-low border border-outline-variant rounded-xl py-3 pl-[40px] pr-3 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors text-on-surface font-body-md uppercase" placeholder="Örn: MEDİKAL PALACE" type="text"/>
                    </div>
                </div>

                <!-- Row 4: Doctor -->
                <div class="flex flex-col gap-1">
                    <label class="font-label-md text-xs font-semibold text-on-surface-variant ml-1">Doktor Adı</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
                            <span class="material-symbols-outlined text-[20px]">person</span>
                        </div>
                        <input id="doktor" class="w-full bg-surface-container-low border border-outline-variant rounded-xl py-3 pl-[40px] pr-3 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors text-on-surface font-body-md uppercase" placeholder="Örn: DR. AHMET YILMAZ" type="text"/>
                    </div>
                </div>

                <!-- Row 5: Notes -->
                <div class="flex flex-col gap-1">
                    <label class="font-label-md text-xs font-semibold text-on-surface-variant ml-1">Notlar</label>
                    <textarea id="not" class="w-full bg-surface-container-low border border-outline-variant rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors text-on-surface font-body-md resize-none" placeholder="Ziyaret detaylarını buraya giriniz..." rows="3"></textarea>
                </div>

                <!-- Submit Button -->
                <button class="mt-2 w-full bg-primary text-on-primary font-headline-sm text-lg font-bold rounded-xl py-4 flex items-center justify-center gap-2 neomorphic-button active:scale-95 transition-all duration-200 relative overflow-hidden group" id="submitBtn" type="button">
                    <div class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <span class="material-symbols-outlined" id="btnIcon">add</span>
                    <span id="btnText">Ziyareti Kaydet</span>
                    <svg class="hidden animate-spin h-6 w-6 text-on-primary" fill="none" id="btnSpinner" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
                    </svg>
                </button>
            </form>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-on-background/40 backdrop-blur-sm z-50 hidden flex-col items-center justify-center px-4 transition-opacity">
        <div class="bg-surface-container-lowest rounded-2xl p-6 w-full max-w-sm neomorphic-card" id="settingsCard">
            <h2 class="text-xl font-bold text-primary mb-2 flex items-center gap-2">
                <span class="material-symbols-outlined">settings</span> Ayarlar
            </h2>
            <p class="text-sm text-on-surface-variant mb-4">Uygulamanın Excel'e veri gönderebilmesi için Google Apps Script bağlantısını buraya yapıştırın.</p>
            <input type="text" id="scriptUrlInput" class="w-full bg-surface-container-low border border-outline-variant rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-primary mb-5 text-sm" placeholder="https://script.google.com/macros/s/.../exec">
            <div class="flex justify-end gap-3">
                <button type="button" id="closeSettingsBtn" class="px-5 py-2.5 text-on-surface-variant font-semibold rounded-xl hover:bg-surface-container-low transition-colors">İptal</button>
                <button type="button" id="saveSettingsBtn" class="px-5 py-2.5 bg-primary text-on-primary rounded-xl font-semibold shadow-md active:scale-95 transition-transform">Kaydet</button>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        // --- TÜRKİYE'NİN 81 İLİ ---
        const sehirler = [
            "Adana", "Adıyaman", "Afyonkarahisar", "Ağrı", "Aksaray", "Amasya", "Ankara", "Antalya", "Artvin", "Aydın",
            "Balıkesir", "Bartın", "Batman", "Bayburt", "Bilecik", "Bingöl", "Bitlis", "Bolu", "Burdur", "Bursa",
            "Çanakkale", "Çankırı", "Çorum", "Denizli", "Diyarbakır", "Düzce", "Edirne", "Elazığ", "Erzincan", "Erzurum",
            "Eskişehir", "Gaziantep", "Giresun", "Gümüşhane", "Hakkari", "Hatay", "Iğdır", "Isparta", "İstanbul", "İzmir",
            "Kahramanmaraş", "Karabük", "Karaman", "Kars", "Kastamonu", "Kayseri", "Kırıkkale", "Kırklareli", "Kırşehir", "Kilis",
            "Kocaeli", "Konya", "Kütahya", "Malatya", "Manisa", "Mardin", "Mersin", "Muğla", "Muş", "Nevşehir",
            "Niğde", "Ordu", "Osmaniye", "Rize", "Sakarya", "Samsun", "Siirt", "Sinop", "Sivas", "Şanlıurfa",
            "Şırnak", "Tekirdağ", "Tokat", "Trabzon", "Tunceli", "Uşak", "Van", "Yalova", "Yozgat", "Zonguldak"
        ].sort((a, b) => a.localeCompare(b, 'tr'));

        document.addEventListener("DOMContentLoaded", () => {
            // Tarihi bugüne ayarla
            document.getElementById("tarih").valueAsDate = new Date();
        });

        // --- AKILLI ARAMA (AUTOCOMPLETE) MANTIĞI ---
        const sehirInput = document.getElementById("sehir");
        const sehirList = document.getElementById("sehirList");
        const ilceInput = document.getElementById("ilce");

        // Listeyi çizme fonksiyonu
        function renderSehirList(filterText = "") {
            sehirList.innerHTML = "";
            
            // Türkçe karakter duyarlı filtreleme
            const filtered = sehirler.filter(s => s.toLocaleLowerCase('tr-TR').includes(filterText.toLocaleLowerCase('tr-TR')));
            
            if (filtered.length === 0) {
                sehirList.innerHTML = '<li class="p-3 text-on-surface-variant text-sm italic">Sonuç bulunamadı</li>';
                return;
            }

            filtered.forEach(sehir => {
                const li = document.createElement("li");
                li.className = "p-3 hover:bg-surface-container-high active:bg-surface-variant cursor-pointer text-on-surface font-body-md border-b border-outline-variant/30 last:border-0";
                li.textContent = sehir;
                
                // Mousedown kullanıyoruz ki input blur olmadan (klavye kapanmadan) tıklamayı algılasın
                li.addEventListener("mousedown", (e) => {
                    e.preventDefault(); 
                    sehirInput.value = sehir;  // Şehir inputuna yaz
                    ilceInput.value = sehir;   // İlçe inputuna otomatik yaz
                    sehirList.classList.add("hidden"); // Listeyi gizle
                });
                sehirList.appendChild(li);
            });
        }

        // Kutuya tıklanınca / Odaklanılınca tüm listeyi göster
        sehirInput.addEventListener("focus", () => {
            renderSehirList(sehirInput.value);
            sehirList.classList.remove("hidden");
        });

        // Klavyeden bir şey yazıldıkça listeyi filtrele
        sehirInput.addEventListener("input", (e) => {
            renderSehirList(e.target.value);
            sehirList.classList.remove("hidden");
        });

        // Başka bir yere tıklayınca listeyi gizle
        sehirInput.addEventListener("blur", () => {
            // Küçük bir gecikme ekliyoruz, mousedown'ın tetiklenmesine izin vermek için
            setTimeout(() => {
                sehirList.classList.add("hidden");
            }, 150);
        });


        // --- AYARLAR MODAL MANTIĞI ---
        const modal = document.getElementById('settingsModal');
        const scriptUrlInput = document.getElementById('scriptUrlInput');

        document.getElementById('openSettingsBtn').addEventListener('click', () => {
            scriptUrlInput.value = localStorage.getItem('scriptUrl') || "";
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        });

        document.getElementById('closeSettingsBtn').addEventListener('click', () => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        });

        document.getElementById('saveSettingsBtn').addEventListener('click', () => {
            const url = scriptUrlInput.value.trim();
            if (url && url.endsWith("/exec")) {
                localStorage.setItem('scriptUrl', url);
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                showToast("Bağlantı başarıyla kaydedildi!", "success");
            } else {
                showToast("Hata: Link /exec ile bitmelidir!", "error");
            }
        });

        // --- BİLDİRİM (TOAST) MANTIĞI ---
        function showToast(message, type = "success") {
            const toast = document.getElementById('toast');
            const toastIcon = document.getElementById('toastIcon');
            const toastText = document.getElementById('toastText');
            
            toastText.textContent = message;
            
            if (type === "success") {
                toast.className = "fixed top-20 left-1/2 transform -translate-x-1/2 z-50 transition-all duration-400 flex items-center gap-2 px-6 py-3 rounded-full shadow-lg font-label-md text-sm font-medium whitespace-nowrap bg-secondary-container text-on-secondary-container";
                toastIcon.textContent = "check_circle";
            } else {
                toast.className = "fixed top-20 left-1/2 transform -translate-x-1/2 z-50 transition-all duration-400 flex items-center gap-2 px-6 py-3 rounded-full shadow-lg font-label-md text-sm font-medium whitespace-nowrap bg-error text-white";
                toastIcon.textContent = "error";
            }
            
            setTimeout(() => { toast.classList.remove('opacity-0', '-translate-y-full'); }, 10);
            setTimeout(() => { toast.classList.add('opacity-0', '-translate-y-full'); }, 3000);
        }

        // --- GÖNDERME MANTIĞI ---
        document.getElementById('submitBtn').addEventListener('click', async function() {
            const btn = this;
            const icon = document.getElementById('btnIcon');
            const text = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');

            const scriptUrl = localStorage.getItem('scriptUrl');
            if (!scriptUrl) {
                showToast("Lütfen sağ üstten Ayarlar'a girip bağlantı linkinizi ekleyin.", "error");
                return;
            }

            const rawDate = document.getElementById("tarih").value;
            if(!rawDate) { showToast("Lütfen tarih seçin.", "error"); return; }
            
            const d = new Date(rawDate);
            const formattedDate = ("0" + d.getDate()).slice(-2) + "." + ("0" + (d.getMonth() + 1)).slice(-2) + "." + d.getFullYear();
            const gunler = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
            const secilenGun = gunler[d.getDay()];

            const ziyaretNoInput = document.getElementById("ziyaretNo");
            const ziyaretNo = ziyaretNoInput.value;
            if(!ziyaretNo) { showToast("Lütfen Ziyaret No girin.", "error"); return; }

            const payload = {
                tarih: formattedDate,
                gun: secilenGun,
                ziyaretNo: ziyaretNo,
                sehir: document.getElementById("sehir").value,
                ilce: document.getElementById("ilce").value,
                hastane: document.getElementById("hastane").value.toUpperCase(),
                doktor: document.getElementById("doktor").value.toUpperCase(),
                not: document.getElementById("not").value
            };

            icon.classList.add('hidden');
            spinner.classList.remove('hidden');
            text.textContent = 'Kaydediliyor...';
            btn.classList.add('opacity-90', 'pointer-events-none');

            try {
                const cacheBuster = "?t=" + new Date().getTime();
                await fetch(scriptUrl + cacheBuster, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'application/json' }
                });

                showToast("Ziyaret başarıyla Excel'e işlendi!", "success");
                
                // --- OTOMATİK NUMARA ARTIRMA VE TEMİZLEME ---
                const guncelNo = parseInt(ziyaretNo, 10);
                if (!isNaN(guncelNo)) {
                    ziyaretNoInput.value = guncelNo + 1; // Numarayı 1 artır
                } else {
                    ziyaretNoInput.value = "";
                }
                
                // Hastane ve Doktor bilgilerini temizle
                document.getElementById("hastane").value = "";
                document.getElementById("doktor").value = "";
                document.getElementById("not").value = "";
                
            } catch (error) {
                showToast("Bağlantı hatası: İnternetinizi kontrol edin.", "error");
            } finally {
                icon.classList.remove('hidden');
                spinner.classList.add('hidden');
                text.textContent = 'Ziyareti Kaydet';
                btn.classList.remove('opacity-90', 'pointer-events-none');
            }
        });
    </script>
</body>
</html>
